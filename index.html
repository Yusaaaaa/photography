<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="摄影日历。" />
  <meta name="theme-color" content="#f3efe6" />
  <title>日历</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='3' fill='%232a2724'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <a class="skip" href="#cal">跳到日历</a>

  <main class="sheet">
    <div class="month-bar">
      <button type="button" class="month-btn" id="prev-year">上一年</button>
      <p class="year" id="year"></p>
      <button type="button" class="month-btn" id="next-year">下一年</button>
      <button type="button" class="month-btn" id="prev">上个月</button>
      <h1 id="month-title">十一月</h1>
      <button type="button" class="month-btn" id="next">下个月</button>
    </div>
    <div id="cal"></div>
    <section class="loose" id="loose" hidden>
      <h2>日期或地点未知</h2>
      <ul id="loose-list"></ul>
    </section>
    <p class="sr" id="live" aria-live="polite"></p>
    <noscript>
      <ul class="noscript">
        <li><a href="day.html?d=2026-10-03">2026年10月3日 · 内蒙古</a></li>
        <li><a href="day.html?d=2026-10-05">2026年10月5日 · 内蒙古</a></li>
        <li><a href="day.html?d=2026-11-11">2026年11月11日 · 深圳湾公园</a></li>
        <li><a href="images/日期未知or地点未知/IMG_4349.jpg">IMG_4349</a></li>
        <li><a href="images/日期未知or地点未知/IMG_5210.jpg">IMG_5210</a></li>
      </ul>
    </noscript>
  </main>

  <script src="js/journal.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
